<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Taller - CleanExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Panel de Taller - Control de Prendas (RF-04)</h3>
        <div class="d-flex gap-2">
            <a href="/pedidos/consulta" class="btn btn-outline-primary">Consultar Pedidos</a>
            <a href="/recepcion" class="btn btn-secondary">Regresar a Mostrador</a>
        </div>
    </div>

    <div class="card p-4 shadow-sm">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID Prenda</th>
                <th>Pedido #</th>
                <th>Tipo</th>
                <th>Descripción</th>
                <th>Estado Actual</th>
                <th>Acción / Cambiar Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${prendas}">
                <td th:text="${p.idPrenda}"></td>
                <td th:text="${p.idPedido}"></td>
                <td th:text="${p.tipoPrenda}"></td>
                <td th:text="${p.descripcionDetalles}"></td>
                <td>
                    <span class="badge bg-warning text-dark" th:text="${p.estadoPrenda}"></span>
                </td>
                <td>
                    <form th:action="@{/taller/actualizar-estado}" method="post" class="d-flex gap-2">
                        <input type="hidden" name="idPrenda" th:value="${p.idPrenda}"/>
                        <select name="nuevoEstado" class="form-select form-select-sm">
                            <option value="Recibida">Recibida</option>
                            <option value="En Lavado">En Lavado</option>
                            <option value="Planchada">Planchada</option>
                            <option value="Lista">Lista</option>
                            <option value="Entregada">Entregada</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-success">Actualizar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
