<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Taller - CleanExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Panel de Taller - Control de Prendas (RF-04)</h3>
        <div class="d-flex gap-2">
            <a href="/pedidos/consulta" class="btn btn-outline-primary">Consultar Pedidos</a>
            <a href="/recepcion" class="btn btn-secondary">Regresar a Mostrador</a>
        </div>
    </div>
    <div class="card p-4 shadow-sm">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Pedido # / Cliente</th>
                <th>Prenda y Color</th>
                <th>Descripción / Detalles</th>
                <th>Proceso Actual</th>
                <th>Cambiar Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${prendas}">
                <td>
                    <span class="fw-bold text-primary" th:text="'Pedido #' + ${p.idPedido}"></span>
                </td>
                <td>
                    <span th:text="${p.tipoPrenda}"></span>
                    <small class="text-muted" th:text="'(' + ${p.color} + ')'"></small>
                </td>
                <td th:text="${p.descripcionDetalles}"></td>
                <td>
                    <span class="badge bg-info text-dark" th:text="${p.estadoPrenda}"></span>
                </td>
                <td>
                    <form th:action="@{/taller/actualizar-estado}" method="post" class="d-flex gap-2">
                        <input type="hidden" name="idPrenda" th:value="${p.idPrenda}"/>
                        <select name="nuevoEstado" class="form-select form-select-sm">
                            <option value="Recibida" th:selected="${p.estadoPrenda == 'Recibida'}">Recibida</option>
                            <option value="En Lavado" th:selected="${p.estadoPrenda == 'En Lavado'}">En Lavado</option>
                            <option value="Planchada" th:selected="${p.estadoPrenda == 'Planchada'}">Planchada</option>
                            <option value="Lista" th:selected="${p.estadoPrenda == 'Lista'}">Lista</option>
                            <option value="Entregada" th:selected="${p.estadoPrenda == 'Entregada'}">Entregada</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-success">Actualizar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
