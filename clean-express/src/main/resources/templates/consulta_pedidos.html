<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Pedidos - CleanExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Consulta de Pedidos (RF-02)</h3>
        <a href="/recepcion" class="btn btn-secondary">Regresar a Mostrador</a>
    </div>

    <!-- Filtro por Estado -->
    <form th:action="@{/pedidos/consulta}" method="get" class="row g-3 mb-4">
        <div class="col-auto">
            <select name="estado" class="form-select">
                <option value="">Todos los estados</option>
                <option value="Recibido" th:selected="${estadoSeleccionado == 'Recibido'}">Recibido</option>
                <option value="En Proceso" th:selected="${estadoSeleccionado == 'En Proceso'}">En Proceso</option>
                <option value="Listo" th:selected="${estadoSeleccionado == 'Listo'}">Listo</option>
                <option value="Entregado" th:selected="${estadoSeleccionado == 'Entregado'}">Entregado</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filtrar</button>
        </div>
    </form>

    <!-- Tabla de Pedidos -->
    <div class="card p-4 shadow-sm">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Folio</th>
                <th>Cliente ID</th>
                <th>Fecha Recepción</th>
                <th>Entrega Estimada</th>
                <th>Total</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pedidos}">
                <td th:text="'#' + ${p.idPedido}"></td>
                <td th:text="${p.idCliente}"></td>
                <td th:text="${p.fechaRecepcion}"></td>
                <td th:text="${p.fechaEntregaEstimada}"></td>
                <td th:text="'$' + ${p.total}"></td>
                <td>
                    <span class="badge bg-info text-dark" th:text="${p.estado}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
